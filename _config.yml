# Site Settings
locale                   : "en-US"
title                    : "Kunal Garg"
title_separator          : "-"
name                     : &name "Kunal Garg"
description              : &description "Ph.D. Candidate in Economics, Texas A&M University"
url                      : "https://gargk98.github.io"  # UPDATE: replace gargk98 with your actual GitHub username
baseurl                  : ""
repository               : "gargk98/gargk98.github.io"  # UPDATE: replace gargk98 with your actual GitHub username

# Site Author
author:
  name             : "Kunal Garg"
  avatar           : "profile.jpg"  # Place your photo in /images/ folder and rename it profile.jpg
  bio              : "Ph.D. Candidate in Economics"
  location         : "College Station, TX"
  employer         : "Texas A&M University"
  email            : "kunalgarg@tamu.edu"
  github           : "gargk98"  # UPDATE: replace with your actual GitHub username
  linkedin         : "gargk98"

# Reading Files
include:
  - .htaccess
  - _pages

# Build Settings
markdown         : kramdown
highlighter      : rouge
lsi              : false
excerpt_separator: "\n\n"
incremental      : false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
