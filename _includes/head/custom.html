<script data-goatcounter="https://gargk98.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  /* Abstract / Details buttons on the Research page */
  .paper-toggles { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 0.6em 0 1.2em; }
  .paper-toggle {
    font: inherit; font-size: 0.8em; font-weight: 600; letter-spacing: 0.02em;
    color: inherit; background: transparent; cursor: pointer;
    padding: 0.2em 0.8em; border: 1px solid rgba(127,127,127,0.55); border-radius: 4px;
  }
  .paper-toggle::before { content: "\25B8\00a0"; }
  .paper-toggle[aria-expanded="true"]::before { content: "\25BE\00a0"; }
  .paper-toggle:hover, .paper-toggle[aria-expanded="true"] { border-color: currentColor; }
  .paper-panel { display: none; margin: -0.4em 0 1.2em; font-size: 0.92em; line-height: 1.6; }
  .paper-panel.is-open { display: block; }
  .paper-panel p { margin: 0 0 0.8em; }
  .paper-panel ul { margin-top: 0; }

  /* Homepage: intro, job market bar, three columns, and short lines below */
  @media (min-width: 1024px) { .page:has(.hp2) { padding-right: 2em !important; } }
  .hp2 { --acc: var(--global-base-color, #2f7f93); --rule: var(--global-dark-border-color, #bdc1c4); }
  .hp2 p { margin: 0 0 0.8em; }
  .hp2-status { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.6em; padding: 0.55em 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 1.2em 0 1.3em !important; }
  .hp2-dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: #2e9b5f; margin-right: 0.5em; vertical-align: 0.08em; }
  .hp2-status-text { flex: 1 1 22em; line-height: 1.45; }
  .hp2-status a { margin-left: auto; font-size: 0.85em; font-weight: 600; white-space: nowrap; align-self: center; }
  .hp2-grid { display: grid; grid-template-columns: 1fr 0.75fr 1.35fr; margin-bottom: 1.4em; }
  .hp2-grid section { padding: 0 1.1em; border-left: 1px solid var(--rule); }
  .hp2-grid section:first-child { padding-left: 0; border-left: none; }
  .hp2-grid h3 { font-size: 0.82em; color: var(--acc); margin: 0 0 0.5em; }
  .hp2-grid ul { list-style: none; margin: 0; padding: 0; }
  .hp2-grid li { font-size: 0.9em; line-height: 1.4; margin: 0 0 0.45em; }
  .hp2-lines { list-style: none; margin: 0 0 1em; padding: 0; }
  .hp2-lines li { font-size: 0.9em; line-height: 1.5; margin: 0 0 0.5em; }
  .hp2-outside { margin-top: 1.2em !important; }
  @media (max-width: 600px) { .hp2-status a { margin-left: 0; } .hp2-grid { grid-template-columns: 1fr; gap: 1em; } .hp2-grid section { padding: 0; border-left: none; } }
</style>
<noscript><style>.paper-panel { display: block; } .paper-toggles { display: none; }</style></noscript>
<script>
  /* Clicking Abstract or Details opens that panel and closes the other one; clicking again closes it.
     Use block comments only: the theme puts the whole page on one line, which breaks // comments. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".paper-toggle");
    if (!btn) return;
    var panel = document.getElementById(btn.getAttribute("data-target"));
    if (!panel) return;
    var opening = !panel.classList.contains("is-open");
    btn.closest(".paper-toggles").querySelectorAll(".paper-toggle").forEach(function (b) {
      var p = document.getElementById(b.getAttribute("data-target"));
      if (p) p.classList.remove("is-open");
      b.setAttribute("aria-expanded", "false");
    });
    if (opening) {
      panel.classList.add("is-open");
      btn.setAttribute("aria-expanded", "true");
    }
  });
</script>
